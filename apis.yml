aid: guild
name: Guild
description: 'Guild (formerly Guild Education) is an education benefits and career
  opportunity platform that partners with large employers to fund and administer
  workforce education, upskilling, and career-mobility programs for their frontline
  and hourly employees. Employers offer Guild as a benefit; employees access a
  curated marketplace of degrees, certificates, bootcamps, English-language, and
  professional-skilling programs from vetted learning providers, plus coaching and
  career navigation to move into higher-demand roles. Guild is a B2B/B2B2C SaaS
  platform sold to enterprise HR and talent-development teams to fill critical
  roles, improve retention, increase internal mobility, and prove measurable ROI.
  Founded in 2015 and headquartered in Denver, Colorado, Guild is a venture-backed
  company. This profile was surfaced from investor portfolios and enriched by the
  API Evangelist pipeline; Guild publishes no public developer API, SDKs, or
  developer documentation at this time.'
